
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b16">
  <title>HEALTH PLANET</title>

  <link rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">

  <link rel="stylesheet" href="css/style.css">
  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="logo" href="#">HEALTH<span>PLANET</span></a>
    <nav>
      <button id="exploreButton">Esplora</button>
      <button id="routesButton">Percorsi</button>
      <button id="aboutButton">Progetto</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">UN PIANETA · UNA SOLA SALUTE</div>
      <h1>La salute non ha<br><span>confini.</span></h1>
      <p>Esplora il mondo e scopri il legame tra salute, ambiente e società.</p>

      <div class="search-box">
        <input id="citySearch" type="search"
          placeholder="Cerca una città o un luogo...">
        <button id="searchButton">Cerca</button>
      </div>
    </section>

    <section class="globe-section">
      <div class="section-heading">
        <div>
          <span class="eyebrow">ESPLORAZIONE GLOBALE</span>
          <h2>Il nostro pianeta</h2>
        </div>
        <span class="status">GLOBO INTERATTIVO</span>
      </div>

      <div id="globeContainer">
        <div id="globe"></div>
        <div class="globe-label">HEALTH PLANET · EARTH</div>
      </div>
    </section>

    <section id="cityPreview" class="city-preview hidden">
      <div class="preview-content">
        <span class="eyebrow">LUOGO SELEZIONATO</span>
        <h2 id="previewName"></h2>
        <p id="previewDescription"></p>
        <button id="openCityButton">Scopri questo luogo</button>
      </div>
    </section>

    <section id="cityContent" class="city-content hidden">
      <button id="backButton" class="back-button">← Torna al globo</button>
      <div class="eyebrow" id="cityCountry"></div>
      <h2 id="cityTitle"></h2>
      <p id="cityDescription"></p>
      <div id="citySections"></div>
    </section>
  </main>

  <footer>
    HEALTH PLANET <span>·</span> Un progetto di educazione alla salute
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
