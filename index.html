
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HEALTH PLANET</title>
  <meta name="description" content="Un viaggio interattivo alla scoperta della salute nel mondo.">

  <link rel="stylesheet" href="css/style.css">

  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  >

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Cesium.js"></script>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-symbol">H</span>
      <span>HEALTH <strong>PLANET</strong></span>
    </div>

    <div class="topbar-right">
      <span class="status-dot"></span>
      SISTEMA ONLINE
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow">UN MONDO DA ESPLORARE</p>
        <h1>HEALTH <span>PLANET</span></h1>
        <p>La salute non ha confini.</p>
      </div>

      <div class="search-box">
        <span>⌕</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Cerca una città..."
          autocomplete="off"
        >
        <div id="searchResults"></div>
      </div>
    </section>

    <section class="globe-section">
      <div id="cesiumContainer"></div>

      <div class="globe-label">
        <span class="status-dot"></span>
        ESPLORAZIONE GLOBALE
      </div>

      <aside id="preview" class="preview hidden">
        <button id="closePreview" class="close-button">×</button>
        <p class="eyebrow">LOCALITÀ SELEZIONATA</p>
        <h2 id="previewName"></h2>
        <p id="previewCountry" class="muted"></p>
        <p id="previewDescription"></p>
        <button id="openCity" class="primary-button">
          SCOPRI LA CITTÀ →
        </button>
      </aside>

      <aside id="cityPanel" class="city-panel hidden">
        <button id="closeCity" class="close-button">×</button>
        <p class="eyebrow">HEALTH PLANET / LOCALITÀ</p>
        <h2 id="cityName"></h2>
        <p id="cityTheme" class="muted"></p>
        <div id="citySections"></div>
      </aside>
    </section>

    <footer>
      <span>HEALTH PLANET</span>
      <span>ESPLORA · CONOSCI · COMPRENDI</span>
    </footer>
  </main>

  <script src="js/app.js"></script>

</body>
</html>
